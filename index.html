<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2f3f4c">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">
    <title>Brobyggare – bygg en bro åt keIWs</title>
    <meta name="description" content="Bygg en bro av riktiga limträbalkar och se om keIWs kommer över. Fysiken räknas på riktigt.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
    <div id="scen">
        <canvas id="duk"></canvas>
        <div id="info"></div>
        <button id="menyknapp" aria-label="Meny">☰</button>
        <button id="guideknapp" aria-label="Guide">?</button>
        <button id="helskarmknapp" aria-label="Helskärm" hidden>
            <svg class="in" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
            <svg class="ut" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5"/></svg>
        </button>
        <button id="delaknapp" aria-label="Dela konstruktionen" hidden>!</button>
        <div id="version"></div>
        <div id="ruta" class="dold"></div>
        <div id="meny" class="dold"><div class="panel"></div></div>
    </div>
    <div id="styrning">
        <div id="valjare"></div>
        <div id="verktyg">
            <button data-v="angra">Ångra</button>
            <button data-v="riv" class="riv">Riv</button>
            <button data-v="kor" class="kor">Kör</button>
        </div>
    </div>
    <div id="dela" class="dold"><div class="panel"><p></p><textarea readonly></textarea></div></div>
    <div id="stortMynt" class="dold"><span class="mynt" role="img" aria-label="mynt"></span></div>
    <div id="popup" class="dold"></div>
    <div id="guide" class="dold"></div>
</div>

<script src="figur_data.js" defer></script>
<script src="material.js" defer></script>
<script src="fysik.js" defer></script>
<script src="banor.js" defer></script>
<script src="spel.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
